# API + Redis Streams + worker + MariaDB. Prometheus and Grafana run with
# the "observability" profile:
#
#   docker compose --profile observability up -d --build
#   open http://localhost:3000   (dashboard "Inspekt")
#
# DEV-ONLY DEFAULTS: the MariaDB and Grafana admin passwords fall back to
# "inspekt-dev", which is public. Anywhere but a laptop, set
# INSPEKT_DB_PASSWORD and INSPEKT_GRAFANA_PASSWORD (see .env.example).
x-inspekt: &inspekt
  build: .
  image: inspekt:local
  read_only: true
  restart: unless-stopped
  depends_on:
    redis: { condition: service_healthy }
    mariadb: { condition: service_healthy }

services:
  redis:
    image: redis:7.4-alpine
    # noeviction: when full, Redis refuses new writes (the API answers 503)
    # instead of silently evicting queued scans. AOF keeps the queue across
    # a Redis restart.
    command: >
      redis-server --maxmemory 64mb --maxmemory-policy noeviction
      --appendonly yes --save ""
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    # maxmemory is checked before each write, so one write may overshoot it
    # by up to a full message (25 MiB, plus the same again in the client
    # buffer). The container limit leaves room for that.
    deploy:
      resources:
        limits: { memory: 160m }

  mariadb:
    image: mariadb:11.4
    # Small footprint for a laptop: 32 MB buffer pool, no performance_schema.
    command: ["--innodb-buffer-pool-size=32M", "--performance-schema=OFF"]
    environment:
      MARIADB_DATABASE: inspekt
      MARIADB_USER: inspekt
      MARIADB_PASSWORD: ${INSPEKT_DB_PASSWORD:-inspekt-dev}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes: ["mariadb-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits: { memory: 256m }

  api:
    <<: *inspekt
    command: ["/inspekt-api"]
    ports: ["8080:8080"]
    environment:
      INSPEKT_ADDR: ":8080"
      INSPEKT_REDIS_ADDR: "redis:6379"
      INSPEKT_MARIADB_DSN: "inspekt:${INSPEKT_DB_PASSWORD:-inspekt-dev}@tcp(mariadb:3306)/inspekt"
      INSPEKT_TRUSTED_AUTHSERV_IDS: ""   # e.g. mx.yourcompany.com in production
      INSPEKT_AUTH_MODE: headers         # verify = own SPF/DKIM/DMARC via DNS
    deploy:
      resources:
        limits: { memory: 256m }   # keep the 8 GB MacBook happy

  worker:
    <<: *inspekt
    command: ["/inspekt-worker"]
    environment:
      INSPEKT_REDIS_ADDR: "redis:6379"
      INSPEKT_MARIADB_DSN: "inspekt:${INSPEKT_DB_PASSWORD:-inspekt-dev}@tcp(mariadb:3306)/inspekt"
      INSPEKT_WORKERS: "4"
      INSPEKT_METRICS_ADDR: ":9090"      # scraped by Prometheus (not published)
      # Go's GC does not see the container limit; without this the heap
      # grows to 256m under large QR images and risks an OOM kill.
      GOMEMLIMIT: 200MiB
      INSPEKT_TRUSTED_AUTHSERV_IDS: ""
      INSPEKT_AUTH_MODE: headers
    # docker stop sends SIGTERM; give in-flight scans time to finish.
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { memory: 256m }

  prometheus:
    image: prom/prometheus:v3.13.5
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    depends_on: [api, worker]
    deploy:
      resources:
        limits: { memory: 256m }

  grafana:
    image: grafana/grafana:13.0.11
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${INSPEKT_GRAFANA_PASSWORD:-inspekt-dev}
      # Read-only anonymous access for a local demo; admin login for edits.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/inspekt.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/inspekt.json:/var/lib/grafana/dashboards/inspekt.json:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
    deploy:
      resources:
        limits: { memory: 384m }

volumes:
  redis-data:
  mariadb-data:
  prometheus-data:
