name: ci
on: [push, pull_request]

jobs:
  go:
    runs-on: ubuntu-latest
    # Real MariaDB for the store tests (they skip without the DSN).
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: inspekt_test
          MARIADB_USER: inspekt
          MARIADB_PASSWORD: inspekt
          MARIADB_RANDOM_ROOT_PASSWORD: "1"
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      INSPEKT_TEST_MARIADB_DSN: inspekt:inspekt@tcp(127.0.0.1:3306)/inspekt_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -coverprofile=cover.out ./...
      - name: short fuzz of the MIME parser
        run: go test ./internal/email -run='^$' -fuzz=FuzzParse -fuzztime=30s
      - name: short fuzz of HTML link extraction
        run: go test ./internal/extract -run='^$' -fuzz=FuzzLinks -fuzztime=30s

  detection-quality:
    # Fails the build if a rule change makes detection worse.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m unittest discover -s eval
      - run: python eval/evaluate.py --labels testdata/labels.csv --min-recall 0.8 --max-fpr 0 --max-parse-errors 0 --out eval/out/sample
      - uses: actions/upload-artifact@v4
        with: { name: eval-report, path: eval/out/ }

  e2e:
    # Real Redis + worker via docker compose: async scans, idempotency,
    # recovery after a worker stop and a Redis restart.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make e2e
