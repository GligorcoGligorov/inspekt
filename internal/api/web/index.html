<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inspekt</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5d6673; --border: #d9dde3;
  --accent: #2f6fdf; --clean: #1f7a45; --suspicious: #a86400; --malicious: #b42318;
  --clean-bg: #e7f5ec; --suspicious-bg: #fdf1dc; --malicious-bg: #fde8e6; --info: #5d6673;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418; --panel: #1a1f25; --text: #e6e9ed; --muted: #9aa4b1; --border: #2c333c;
    --accent: #6b9cff; --clean: #5fd08e; --suspicious: #f0b45a; --malicious: #ff7b6e;
    --clean-bg: #15301f; --suspicious-bg: #352611; --malicious-bg: #3a1714; --info: #9aa4b1;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
h1 { font-size: 22px; margin: 0 0 4px; }
p.lead { margin: 0 0 24px; color: var(--muted); }
#drop { display: block; border: 2px dashed var(--border); border-radius: 10px; background: var(--panel);
  padding: 36px 16px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
#drop.over, #drop:focus-within { border-color: var(--accent); }
#drop strong { color: var(--accent); }
#drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
#status { margin: 16px 0 0; min-height: 1.5em; color: var(--muted); }
#status.error { color: var(--malicious); }
#result { margin-top: 20px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
.verdict { font-size: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
  padding: 6px 14px; border-radius: 8px; }
.verdict.clean { color: var(--clean); background: var(--clean-bg); }
.verdict.suspicious { color: var(--suspicious); background: var(--suspicious-bg); }
.verdict.malicious { color: var(--malicious); background: var(--malicious-bg); }
.score { flex: 1; min-width: 200px; }
.bar { height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; margin-top: 4px; }
.bar > div { height: 100%; background: var(--accent); }
.meta { margin: 14px 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px;
  color: var(--muted); font-size: 14px; }
.meta dd { margin: 0; color: var(--text); overflow-wrap: anywhere; }
h2 { font-size: 16px; margin: 0 0 10px; }
ul.signals { list-style: none; margin: 0; padding: 0; }
ul.signals > li { border-top: 1px solid var(--border); padding: 10px 0; display: grid;
  grid-template-columns: 56px 1fr; gap: 2px 12px; }
ul.signals > li:first-child { border-top: 0; }
.pts { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.sev-high .pts { color: var(--malicious); } .sev-medium .pts { color: var(--suspicious); }
.sev-low .pts, .sev-info .pts { color: var(--info); }
.sig { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; }
.check { color: var(--muted); font-size: 13px; margin-left: 6px; }
ul.ev { grid-column: 2; margin: 2px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.empty { color: var(--muted); }
.hidden-note { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
ul.hidden-runs { list-style: none; margin: 0; padding: 0; }
ul.hidden-runs > li { border-top: 1px solid var(--border); padding: 8px 0; }
ul.hidden-runs > li:first-child { border-top: 0; }
.why { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: var(--suspicious); }
ul.campaigns { list-style: none; margin: 0; padding: 0; }
ul.campaigns > li { border-top: 1px solid var(--border); padding: 8px 0; overflow-wrap: anywhere; }
ul.campaigns > li:first-child { border-top: 0; }
ul.campaigns > li.this { font-weight: 600; }
.cid { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: var(--muted); }
blockquote.hid { margin: 4px 0 0; padding: 6px 10px; border-left: 3px solid var(--suspicious);
  background: var(--suspicious-bg); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
footer { margin-top: 32px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Inspekt</h1>
  <p class="lead">Drop a raw email (<code>.eml</code>) to see the verdict and the evidence behind every point of the score.</p>

  <label id="drop">
    <input id="file" type="file" accept=".eml,message/rfc822,text/plain">
    <strong>Choose an .eml file</strong> or drag it here
  </label>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="result" hidden></section>

  <footer>The message is sent only to this server's <code>POST /v1/scans</code>. Try the files in <code>testdata/</code>.</footer>
</main>

<script>
"use strict";
// Every string from the email reaches the page through textContent, never
// innerHTML: the report is attacker-controlled data.
const $ = (id) => document.getElementById(id);
const drop = $("drop"), input = $("file"), statusEl = $("status"), result = $("result");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function setStatus(text, isError) {
  statusEl.textContent = text;
  statusEl.className = isError ? "error" : "";
}

async function scan(file) {
  result.hidden = true;
  result.replaceChildren();
  setStatus("Scanning " + file.name + "…");
  try {
    const res = await fetch("/v1/scans", { method: "POST", body: file, headers: { "Content-Type": "message/rfc822" } });
    const body = await res.json().catch(() => ({}));
    if (res.status === 200 && body.verdict) return render(body, null);      // inline mode
    if (res.status === 202 || (res.status === 200 && body.id)) return poll(res.headers.get("Location") || "/v1/scans/" + body.id);
    throw new Error(body.error || "HTTP " + res.status);
  } catch (err) {
    setStatus("Could not scan: " + err.message, true);
  }
}

async function poll(location) {
  for (let i = 0; i < 100; i++) {
    const res = await fetch(location);
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || "HTTP " + res.status);
    if (body.status === "done" && body.report) return render(body.report, body.id);
    if (body.status === "failed") throw new Error(body.error || "scan failed");
    setStatus("Queued, waiting for a worker…");
    await new Promise((r) => setTimeout(r, 250));
  }
  throw new Error("timed out waiting for the result");
}

// scanId is known in async mode; campaigns need the result store anyway.
function render(rep, scanId) {
  setStatus("");
  const top = el("div", "card");
  const head = el("div", "head");
  head.append(el("span", "verdict " + rep.verdict, rep.verdict));
  const score = el("div", "score");
  score.append(el("div", null, "Score " + rep.score + " / 100"));
  const bar = el("div", "bar"), fill = el("div");
  fill.style.width = Math.max(0, Math.min(100, rep.score)) + "%";
  bar.append(fill);
  score.append(bar);
  head.append(score);
  top.append(head);

  const msg = rep.message || {};
  const meta = el("dl", "meta");
  const row = (k, v) => { meta.append(el("dt", null, k), el("dd", null, v)); };
  row("From", msg.from ? (msg.from.name ? msg.from.name + " <" + msg.from.email + ">" : msg.from.email) : "(none)");
  row("Subject", msg.subject || "(none)");
  row("Links", String((rep.links || []).length));
  row("Attachments", String((msg.attachments || []).length));
  row("Rules", rep.engine || "");
  top.append(meta);

  const sigs = el("div", "card");
  sigs.append(el("h2", null, "Signals"));
  const list = el("ul", "signals");
  for (const s of rep.signals || []) {
    const li = el("li", "sev-" + s.severity);
    li.append(el("span", "pts", (s.score > 0 ? "+" : "") + s.score));
    const name = el("div");
    name.append(el("span", "sig", s.id), el("span", "check", s.check));
    li.append(name);
    const ev = el("ul", "ev");
    for (const e of s.evidence || []) ev.append(el("li", null, e));
    li.append(ev);
    list.append(li);
  }
  if (!list.children.length) sigs.append(el("p", "empty", "No signals: nothing in this message matched a rule."));
  else sigs.append(list);

  const cards = [top, sigs];
  const inj = (rep.signals || []).find((s) => s.id === "ai_prompt_injection");
  if (inj) {
    const c = el("div", "card");
    c.append(el("h2", null, "AI-assistant prompt injection (informational)"));
    c.append(el("p", "hidden-note", "Text in this email is written for an AI assistant that reads the mailbox, not for the person. " +
      "Shown for the analyst; it adds 0 points and does not change the verdict."));
    for (const e of inj.evidence || []) c.append(el("blockquote", "hid", e));
    cards.push(c);
  }
  const hid = rep.hidden;
  if (hid) {
    const h = el("div", "card");
    h.append(el("h2", null, "Hidden from the reader"));
    h.append(el("p", "hidden-note", hid.chars + " hidden letters/digits, " + hid.zero_width +
      " invisible characters. This text is in the email but a person reading it would not see it."));
    const runs = el("ul", "hidden-runs");
    for (const r of hid.runs || []) {
      const li = el("li");
      li.append(el("span", "why", r.reason + (r.visible_before === 0 ? " (before any visible text)" : "")));
      li.append(el("blockquote", "hid", r.text));
      runs.append(li);
    }
    if (hid.comments) {
      const li = el("li");
      li.append(el("span", "why", "HTML comment"), el("blockquote", "hid", hid.comments));
      runs.append(li);
    }
    if (runs.children.length) h.append(runs);
    cards.push(h);
  }
  const camp = el("div", "card");
  camp.append(el("h2", null, "Campaigns (last 24 hours)"));
  const campBody = el("p", "hidden-note", "Looking for related emails…");
  camp.append(campBody);
  cards.push(camp);
  result.replaceChildren(...cards);
  result.hidden = false;
  loadCampaigns(camp, campBody, scanId);
}

// Campaigns: scans that share a link host, attachment, sending IP or subject
// pattern. A correlation view only; it never changes a verdict.
async function loadCampaigns(card, note, scanId) {
  try {
    const res = await fetch("/v1/campaigns?since=24h&min_size=2&min_verdict=clean");
    const body = await res.json().catch(() => ({}));
    if (res.status === 501) { note.textContent = "Campaigns need the full stack (Redis, worker and MariaDB)."; return; }
    if (!res.ok) throw new Error(body.error || "HTTP " + res.status);
    const list = body.campaigns || [];
    const mine = list.find((c) => scanId && (c.scan_ids || []).includes(scanId));
    note.textContent = list.length + (list.length === 1 ? " campaign" : " campaigns") + " in " +
      (body.window ? body.window.scans : 0) + " emails. " +
      (mine ? "This email belongs to campaign " + mine.id + "." : "This email is not part of a campaign.");
    const hhmm = (t) => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    const ul = el("ul", "campaigns");
    for (const c of list.slice(0, 10)) {
      const li = el("li", c === mine ? "this" : null);
      const shared = (c.indicators || []).slice(0, 2).map((i) => i.value + " (" + i.kind + ")").join(", ");
      li.append(el("span", null, c.size + " emails · first seen " + hhmm(c.first_seen) + " · last seen " +
        hhmm(c.last_seen) + (shared ? " · shared: " + shared : "") + (c === mine ? " · this email" : "")));
      li.append(el("span", "cid", "  " + c.id));
      ul.append(li);
    }
    if (ul.children.length) card.append(ul);
  } catch (err) {
    note.textContent = "Could not load campaigns: " + err.message;
  }
}

input.addEventListener("change", () => { if (input.files[0]) scan(input.files[0]); input.value = ""; });
for (const ev of ["dragenter", "dragover"]) drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); });
for (const ev of ["dragleave", "drop"]) drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); });
drop.addEventListener("drop", (e) => { const f = e.dataTransfer.files[0]; if (f) scan(f); });
</script>
</body>
</html>
